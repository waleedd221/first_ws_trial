scan_filter:
  ros__parameters:
    filter1:
      name: min_max_range
      type: laser_filters/LaserScanRangeFilter
      params:
        use_message_range_limits: false
        lower_threshold: 0.28          # closer = the robot's own mast
        upper_threshold: 12.0          # beyond the LiDAR's range
        lower_replacement_value: .nan  # → "no reading"
        upper_replacement_value: .nan  # → "no reading"
